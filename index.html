<style>
:root{
  --cream:#FBF7EC; --tan:#F5E7B8; --tan-deep:#E9D9A6;
  --maroon:#5D1023; --wine:#3E0B18; --blue:#A9C0DD; --slate:#47607F; --ink:#2A0A12;
  --wrap:1180px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{margin:0;background:var(--maroon);color:var(--cream);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:96px;}
a{color:inherit;}
button{font-family:inherit;}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;position:relative;z-index:2;}
.mono{font-family:'DM Mono',ui-monospace,monospace;letter-spacing:0.14em;text-transform:uppercase;}

/* background wave */
.bg-wave{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;z-index:0;opacity:0.12;pointer-events:none;}
.bg-wave span{width:16px;border-radius:8px;background:var(--blue);display:block;animation:bgWave 2.6s ease-in-out infinite;}
@keyframes bgWave{0%,100%{transform:scaleY(0.5);}50%{transform:scaleY(1.25);}}
.glow{position:fixed;top:-160px;right:-160px;width:460px;height:460px;background:radial-gradient(circle,rgba(169,192,221,0.18),transparent 70%);pointer-events:none;z-index:0;}

/* header */
.header{position:sticky;top:0;z-index:20;background:rgba(62,11,24,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(245,231,184,0.14);}
.header .wrap{display:flex;align-items:center;gap:22px;height:66px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:15px;color:var(--cream);}
.brand img{width:36px;height:36px;border-radius:9px;object-fit:cover;}
.nav{display:flex;gap:4px;margin-left:12px;}
.nav a{text-decoration:none;font-weight:600;font-size:14.5px;color:rgba(251,247,236,0.8);padding:8px 12px;border-radius:999px;}
.nav a:hover,.nav a.active{color:var(--wine);background:var(--tan);}
.header-cta{margin-left:auto;display:flex;align-items:center;gap:10px;}
.mini-wave{display:flex;align-items:flex-end;gap:2px;height:14px;}
.mini-wave span{width:2px;background:var(--blue);border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;}
@keyframes eq{0%,100%{transform:scaleY(0.55);}50%{transform:scaleY(1.5);}}
.pill-btn{display:inline-flex;align-items:center;gap:8px;background:var(--tan);color:var(--wine);text-decoration:none;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;border:none;cursor:pointer;white-space:nowrap;}
.pill-btn:hover{background:var(--cream);}

/* hero */
.hero{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:56px;align-items:center;padding:56px 0 40px;}
.hero-frame{position:relative;border-radius:26px;border:2px dashed rgba(245,231,184,0.6);padding:9px;animation:jiggle 6s ease-in-out infinite;}
.hero-frame .img-wrap{border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,0.35);}
.hero-frame img{display:block;width:100%;height:auto;}
.badge{position:absolute;top:-13px;left:18px;background:var(--wine);color:var(--tan);font-size:11px;font-weight:700;letter-spacing:0.08em;padding:7px 13px;border-radius:999px;transform:rotate(-6deg);box-shadow:0 6px 14px rgba(0,0,0,0.35);z-index:3;}
@keyframes jiggle{0%,90%,100%{transform:rotate(0);}91%{transform:rotate(-1.6deg);}92.5%{transform:rotate(1.6deg);}94%{transform:rotate(-1deg);}95.5%{transform:rotate(1deg);}97%{transform:rotate(-0.5deg);}98.5%{transform:rotate(0.5deg);}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;color:var(--tan);font-weight:500;margin-bottom:18px;}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--blue);}
.hero h1{font-weight:800;font-size:clamp(46px,7vw,92px);line-height:0.95;letter-spacing:-0.035em;margin:0 0 18px;color:var(--tan);}
.hero h1 em{font-style:normal;color:var(--blue);}
.tagline{font-family:'Fraunces',serif;font-size:clamp(18px,2vw,22px);line-height:1.5;color:rgba(251,247,236,0.92);margin:0 0 6px;}
.tagline-sub{font-size:15px;color:rgba(245,231,184,0.7);margin:0 0 24px;}
.sticker-row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 28px;}
.sticker{display:inline-block;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:14px;line-height:1.3;color:var(--wine);animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) both,pulse 2.8s ease-in-out infinite;}
.sticker.blue{background:var(--blue);border-bottom-left-radius:4px;}
.sticker.tan{background:var(--tan);border-bottom-right-radius:4px;}
.sticker-row span:nth-child(2){animation-delay:0.15s,0.85s;}
.sticker-row span:nth-child(3){animation-delay:0.3s,1s;}
@keyframes popIn{0%{transform:scale(0.3);opacity:0;}65%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.listen-row{display:flex;gap:10px;flex-wrap:wrap;}
.lbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 16px 12px 12px;border-radius:16px;text-decoration:none;font-weight:700;font-size:14.5px;color:var(--wine);background:var(--cream);transition:transform .15s ease;}
.lbtn:hover{transform:translateY(-2px);}
.lbtn.tan{background:var(--tan);}
.ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ico.spotify{background:#1DB954;} .ico.apple{background:linear-gradient(135deg,#F452FF,#832BC1);} .ico.yt{background:#FF0033;} .ico.ig{background:linear-gradient(135deg,#FEDA75,#D62976 50%,#4F5BD5);} .ico.rss{background:#F26522;}

/* latest banner */
.latest{display:flex;align-items:center;gap:16px;background:var(--tan);color:var(--wine);border-radius:20px;padding:16px 18px;margin-bottom:48px;}
.latest .play-big{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--wine);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;animation:playPulse 1.6s ease-in-out infinite;}
.latest .play-big::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--wine);opacity:0;animation:ring 1.6s ease-out infinite;}
@keyframes playPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes ring{0%{transform:scale(0.8);opacity:0.6;}100%{transform:scale(1.35);opacity:0;}}
.latest .lbl{font-size:11px;color:var(--slate);margin-bottom:4px;}
.latest a{font-weight:800;font-size:clamp(16px,2vw,19px);line-height:1.3;text-decoration:none;}
.latest a:hover{text-decoration:underline;}
.latest .meta{font-size:13px;color:rgba(62,11,24,0.65);margin-top:3px;}

/* main grid */
.grid{display:grid;grid-template-columns:1fr 320px;gap:48px;align-items:start;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 18px;}
.section-head h2{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:0;color:var(--cream);}
.section-head a{font-size:14px;font-weight:700;color:var(--tan);text-decoration:none;}
.section-head a:hover{text-decoration:underline;}

/* episode cards */
.ep{display:grid;grid-template-columns:auto 1fr 84px;gap:18px;background:var(--cream);color:var(--wine);border-radius:20px;padding:20px;margin-bottom:14px;transition:transform .15s ease,box-shadow .15s ease;}
.ep:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,0.25);}
.ep .play{width:46px;height:46px;border-radius:50%;background:var(--maroon);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ep .play:hover{background:var(--wine);}
.ep .play.on{background:var(--slate);}
.ep h3{margin:0 0 8px;font-size:18px;line-height:1.3;font-weight:800;letter-spacing:-0.01em;}
.ep h3 a{text-decoration:none;}
.ep h3 a:hover{text-decoration:underline;}
.ep p{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:rgba(42,10,18,0.78);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ep .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--slate);font-weight:600;}
.ep .art{width:84px;height:84px;border-radius:12px;object-fit:cover;}
.chip{display:inline-block;background:var(--wine);color:var(--tan);font-size:10.5px;font-weight:700;letter-spacing:0.08em;padding:4px 9px;border-radius:999px;margin-bottom:8px;}

/* sidebar */
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px;}
.card{background:rgba(62,11,24,0.6);border:1px solid rgba(245,231,184,0.18);border-radius:20px;padding:20px;}
.card h4{margin:0 0 14px;font-size:11px;font-weight:500;color:var(--blue);}
.follow a{display:flex;align-items:center;gap:12px;padding:9px 0;text-decoration:none;font-weight:600;font-size:15px;color:var(--cream);}
.follow a:hover{color:var(--tan);}
.offer{background:var(--tan);color:var(--wine);border:none;}
.offer h4{color:var(--slate);}
.offer h5{margin:0 0 6px;font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-0.01em;}
.offer p{margin:0 0 14px;font-size:14px;line-height:1.55;}
.offer .go{display:inline-flex;align-items:center;gap:8px;background:var(--wine);color:var(--tan);text-decoration:none;font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px;}
.offer .go:hover{background:var(--maroon);}
.free a{display:block;text-decoration:none;padding:12px 0;border-top:1px solid rgba(245,231,184,0.14);}
.free a:first-of-type{border-top:none;padding-top:0;}
.free strong{display:block;font-size:15px;color:var(--tan);margin-bottom:3px;}
.free span{font-size:13.5px;line-height:1.5;color:rgba(251,247,236,0.75);}
.free a:hover strong{text-decoration:underline;}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:72px 0 24px;}
.about h2{font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-0.02em;margin:0;color:var(--tan);}
.about p{font-family:'Fraunces',serif;font-size:17px;line-height:1.7;color:rgba(251,247,236,0.92);margin:0 0 16px;}
.highlight{background:rgba(245,231,45,0.28);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0.1em 0.15em;border-radius:3px;font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px;}
.signoff{font-family:'DM Sans',sans-serif !important;font-weight:700;color:var(--tan) !important;}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px 0 8px;}
.box{border-radius:18px;padding:18px;color:var(--wine);position:relative;overflow:hidden;}
.box:nth-child(1){background:var(--tan);} .box:nth-child(2){background:var(--tan-deep);} .box:nth-child(3){background:var(--blue);} .box:nth-child(4){background:var(--wine);color:var(--tan);border:1px solid rgba(245,231,184,0.25);}
.box .n{font-size:11px;margin-bottom:10px;opacity:0.8;}
.box p{margin:0;font-weight:600;font-size:15px;line-height:1.5;}
.box .arr{opacity:0.7;margin-top:8px;font-size:14px;}

/* episodes page */
.page-head{padding:48px 0 24px;}
.page-head h1{font-size:clamp(36px,5vw,60px);font-weight:800;letter-spacing:-0.03em;margin:0 0 8px;color:var(--tan);}
.page-head p{margin:0;color:rgba(251,247,236,0.75);}
.search{width:100%;max-width:520px;margin-top:20px;display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:999px;padding:4px 6px 4px 18px;}
.search input{flex:1;border:none;background:transparent;font:inherit;font-size:15px;color:var(--wine);padding:10px 0;outline:none;}
.search input::placeholder{color:rgba(62,11,24,0.5);}
.count{font-size:13px;color:rgba(245,231,184,0.7);margin:18px 0 0;}
.more{display:block;margin:20px auto 0;}

/* episode detail */
.detail{display:grid;grid-template-columns:1fr 320px;gap:48px;align-items:start;padding:40px 0;}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tan);text-decoration:none;font-weight:700;font-size:14px;margin-bottom:22px;}
.back:hover{text-decoration:underline;}
.detail-top{display:flex;gap:22px;align-items:flex-start;margin-bottom:26px;}
.detail-top img{width:140px;height:140px;border-radius:18px;object-fit:cover;flex:0 0 auto;box-shadow:0 14px 30px rgba(0,0,0,0.3);}
.detail h1{font-size:clamp(26px,3.6vw,40px);line-height:1.15;font-weight:800;letter-spacing:-0.02em;margin:0 0 12px;color:var(--cream);}
.detail .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--blue);font-weight:600;margin-bottom:16px;}
.notes{background:var(--cream);color:var(--ink);border-radius:22px;padding:28px;font-size:16px;line-height:1.7;overflow-wrap:anywhere;}
.notes p{margin:0 0 14px;}
.notes ul,.notes ol{margin:0 0 14px;padding-left:22px;}
.notes li{margin-bottom:6px;}
.notes a{color:var(--maroon);font-weight:700;}
.share-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--tan);border:1px solid rgba(245,231,184,0.4);text-decoration:none;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;}
.ghost:hover{background:rgba(245,231,184,0.1);}

/* states */
.state{background:rgba(62,11,24,0.6);border:1px dashed rgba(245,231,184,0.3);border-radius:20px;padding:28px;text-align:center;color:rgba(251,247,236,0.8);}
.skel{height:132px;border-radius:20px;background:linear-gradient(90deg,rgba(251,247,236,0.08),rgba(251,247,236,0.16),rgba(251,247,236,0.08));background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:14px;}
@keyframes sh{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* footer */
.footer{border-top:1px solid rgba(245,231,184,0.18);margin-top:64px;padding:32px 0 24px;}
.footer .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
.footer-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.footer-links a{font-size:12px;font-weight:600;letter-spacing:0.04em;color:var(--tan);background:rgba(62,11,24,0.55);border:1px solid rgba(245,231,184,0.3);padding:8px 13px;border-radius:999px;text-decoration:none;}
.footer-links a:hover{background:rgba(245,231,184,0.12);}
.footer-copy{margin:0;font-size:12px;color:rgba(245,231,184,0.6);text-align:center;}
.footer-legal{margin:0;font-size:12px;}
.footer-legal a{color:rgba(245,231,184,0.75);text-decoration:none;font-weight:600;}
.footer-legal a:hover{text-decoration:underline;}

/* player */
.player{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;max-width:var(--wrap);margin:0 auto;background:var(--wine);border:1px solid rgba(245,231,184,0.25);border-radius:20px;padding:10px 14px;display:none;align-items:center;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,0.45);}
.player.show{display:flex;}
.player img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 auto;}
.player .pp{width:44px;height:44px;border-radius:50%;background:var(--tan);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.player .info{flex:1;min-width:0;}
.player .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream);}
.player .bar{display:flex;align-items:center;gap:10px;margin-top:6px;}
.player .time{font-size:11.5px;color:rgba(245,231,184,0.7);font-variant-numeric:tabular-nums;white-space:nowrap;}
.player input[type=range]{flex:1;accent-color:var(--tan);height:4px;}
.ctrl{background:rgba(245,231,184,0.12);color:var(--tan);border:none;border-radius:999px;font-weight:700;font-size:12px;padding:8px 10px;cursor:pointer;white-space:nowrap;}
.ctrl:hover{background:rgba(245,231,184,0.22);}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
.reveal.is-visible{opacity:1;transform:none;}

@media (max-width:960px){
  .grid,.detail{grid-template-columns:1fr;}
  .side{position:static;}
  .boxes{grid-template-columns:1fr 1fr;}
  .about{grid-template-columns:1fr;gap:20px;}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:34px;padding:34px 0 28px;}
  .hero-frame{max-width:420px;}
  .nav{margin-left:0;}
  .nav a{padding:8px 10px;font-size:14px;}
  .brand span,.mini-wave,.header-cta .pill-btn{display:none;}
  .ep{grid-template-columns:auto 1fr;gap:14px;padding:16px;}
  .ep .art{display:none;}
  .detail-top{flex-direction:column;}
  .detail-top img{width:110px;height:110px;}
  .notes{padding:20px;}
  .player .skip,.player .ctrl.back15{display:none;}
}
@media (max-width:420px){ .boxes{grid-template-columns:1fr;} .player .time{display:none;} }
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;}
  .reveal{opacity:1 !important;transform:none !important;transition:none !important;}
}

/* home layout */
.home{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:48px;align-items:start;padding:48px 0 0;}
.home-left{position:sticky;top:90px;}
.home-left .hero-frame{margin-bottom:22px;}
.bio{font-size:15.5px;line-height:1.6;color:rgba(251,247,236,0.9);margin:0 0 8px;}
.bio-more{display:inline-block;font-weight:700;font-size:15px;color:var(--tan);text-decoration:none;margin-bottom:18px;}
.bio-more:hover{text-decoration:underline;}
.bio-meta{font-size:13px;color:rgba(245,231,184,0.65);margin:0;}
.home-title{font-weight:800;font-size:clamp(38px,4.4vw,58px);line-height:1.02;letter-spacing:-0.035em;margin:0 0 40px;color:var(--tan);}
.home-title .host{display:block;font-size:0.36em;letter-spacing:-0.01em;color:var(--cream);margin-top:12px;font-weight:700;}
.home-title em{font-style:normal;color:var(--blue);}
.home .side{top:90px;}
@media (max-width:1100px){.home{grid-template-columns:260px minmax(0,1fr);}.home .side{grid-column:2;position:static;}}
@media (max-width:760px){.home{grid-template-columns:1fr;gap:28px;padding-top:28px;}.home-left{position:static;}.home-left .hero-frame{max-width:340px;}.home .side{grid-column:auto;}.home-title{margin-bottom:24px;}}
</style>

  function sanitize(html){
    var doc=new DOMParser().parseFromString('<div>'+clean(html)+'</div>','text/html');
    var root=doc.body.firstChild;
    root.querySelectorAll('script,style,iframe,object,embed,form,link,meta').forEach(function(n){n.remove();});
    root.querySelectorAll('*').forEach(function(n){
      Array.prototype.slice.call(n.attributes).forEach(function(a){
        var k=a.name.toLowerCase();
        if(k==='href'){ if(/^\s*javascript:/i.test(a.value)) n.removeAttribute('href'); }
        else n.removeAttribute(a.name);
      });
      if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener');}
    });
    /* turn plain URLs into links */
    var walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],t;
    while((t=walker.nextNode())){ if(!(t.parentNode&&t.parentNode.closest&&t.parentNode.closest('a')) && /https?:\/\//.test(t.nodeValue)) nodes.push(t); }
    nodes.forEach(function(node){
      var span=doc.createElement('span');
      span.innerHTML=esc(node.nodeValue).replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
      node.parentNode.replaceChild(span,node);
    });
    /* drop empty paragraphs */
    root.querySelectorAll('p').forEach(function(p){ if(!p.textContent.trim() && !p.querySelector('img')) p.remove(); });
    return root.innerHTML;
  }

  function parseFeed(xmlText){
    var xml=new DOMParser().parseFromString(xmlText,'application/xml');

  function fetchWithTimeout(url,ms){
    return new Promise(function(res,rej){
      var done=false, timer=setTimeout(function(){if(!done){done=true;rej(new Error('timeout'));}},ms);
      fetch(url,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('status '+r.status);
        return r.text();
      }).then(function(t){
        if(done)return; done=true; clearTimeout(timer);
        if(t.indexOf('<rss')===-1&&t.indexOf('<channel')===-1) rej(new Error('not rss')); else res(t);
      }).catch(function(e){if(!done){done=true;clearTimeout(timer);rej(e);}});
    });
  }

  function loadFeed(){

    var i=0;
    function next(){
      if(i>=sources.length) return Promise.reject(new Error('all sources failed'));
      return fetchWithTimeout(sources[i++],12000).catch(next);
    }
    return next();
  }

  pPlay.addEventListener('click',function(){ if(!current)return; audio.paused?audio.play():audio.pause(); });
  document.getElementById('pBack').addEventListener('click',function(){audio.currentTime=Math.max(0,audio.currentTime-15);});
  document.getElementById('pFwd').addEventListener('click',function(){audio.currentTime=Math.min(audio.duration||0,audio.currentTime+30);});
  pSpeed.addEventListener('click',function(){sIdx=(sIdx+1)%speeds.length;audio.playbackRate=speeds[sIdx];pSpeed.textContent=speeds[sIdx]+'x';});
  audio.addEventListener('play',syncButtons); audio.addEventListener('pause',syncButtons); audio.addEventListener('ended',syncButtons);
  audio.addEventListener('loadedmetadata',function(){pDur.textContent=fmtTime(audio.duration);});
  audio.addEventListener('timeupdate',function(){
    if(seeking||!audio.duration) return;
    pSeek.value=Math.round(audio.currentTime/audio.duration*100); pCur.textContent=fmtTime(audio.currentTime);
  });
  pSeek.addEventListener('input',function(){seeking=true; if(audio.duration) pCur.textContent=fmtTime(pSeek.value/100*audio.duration);});
  pSeek.addEventListener('change',function(){ if(audio.duration) audio.currentTime=pSeek.value/100*audio.duration; seeking=false; });

  route();
})();
</script>
</body>
</html>
